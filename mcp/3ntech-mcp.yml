authorship_note: This is Shopify's Universal Commerce Protocol server (initialize returns serverInfo name
  "universal-commerce", version 0.1.0), served under 3N Eyecare's own domain and bound to 3N Eyecare's
  merchant identity. The tool set is the Shopify UCP shopping fingerprint (create_cart / complete_checkout
  / search_catalog), not tooling 3N TECH authored. It is a real, reachable, anonymous agent surface on
  the company's host and is recorded as such — but it is platform-authored and must not be read as first-party
  API design.
deployment:
  mode: remote
  endpoint: https://www.3neyecare.com/api/ucp/mcp
  auth: none
  verified: probed
  note: 'tools/list and initialize both answered anonymously over HTTP POST with Accept: application/json,
    text/event-stream. No install step, no package, no local stdio variant is published. tools/call additionally
    requires a meta.ucp-agent.profile URI (a fetchable agent profile), so listing is open while invocation
    requires an agent identity — no API key or OAuth token.'
