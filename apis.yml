aid: 3ntech
name: 3N TECH
description: '3N TECH (Suzhou 3N Biological Technology Co., Ltd.) is a Chinese eye-care
  medical-device maker founded in 2015 and headquartered in Suzhou Industrial Park
  BioBAY, with an international arm selling in Hong Kong and the United States. It
  develops active contact-lens care hardware built on its patented Electrophoresis-Disintegration
  ("Elepy") technology, and shipped the first contact-lens cleaner to hold an FDA 510(k)
  clearance for that mechanism. The company sells under two brands: 3N in mainland
  China and ReO2 internationally, through the 3N Eyecare direct-to-consumer storefront.
  3N TECH publishes no developer program and no OpenAPI. Its only machine-readable,
  publicly callable surface is the agentic-commerce layer on its own storefront host:
  an anonymous UCP (Universal Commerce Protocol) merchant profile at
  /.well-known/ucp.json, an unauthenticated MCP endpoint at /api/ucp/mcp serving 13
  cart, checkout, order and catalog tools, an llms.txt / agents.md pair of agent
  instructions, and Shopify Customer Account OAuth 2.0 / OpenID Connect discovery
  documents. That surface is platform-authored by Shopify and served under the
  company''s domain, which this profile records explicitly rather than crediting it
  as first-party API design.'
