apis:
- name: 3N Eyecare Agentic Commerce (UCP / MCP)
  description: The Universal Commerce Protocol shopping service 3N Eyecare exposes on
    its own storefront host. An anonymous JSON-RPC 2.0 MCP endpoint serves 13 tools
    for catalog search and lookup, cart create/update/cancel, checkout create/update/
    complete/cancel and order retrieval, each with a published JSON Schema inputSchema.
    Checkout completion requires contemporaneous human approval, which the store states
    in both robots.txt and llms.txt. The runtime is Shopify's UCP implementation
    (serverInfo name "universal-commerce", version 0.1.0), served under the 3N Eyecare
    merchant identity (merchant_name "3N Eyecare", merchant_origin www.3neyecare.com).
  image: https://www.3neyecare.com/cdn/shop/files/LOGO.png?v=1683448741
  humanURL: https://www.3neyecare.com/llms.txt
  baseURL: https://www.3neyecare.com/api/ucp/mcp
